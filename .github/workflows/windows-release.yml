name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python 3.12 (gateway runtime for smoke)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Sync gateway sources into Tauri resources
        working-directory: desktop
        run: npm run sync-gateway

      - name: Run os_crypt unit tests
        working-directory: desktop/crates/os_crypt
        run: cargo test -- --nocapture

      - name: Build Tauri (NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          args: -- --bundles nsis,msi
          tagName: ${{ github.ref_name }}
          releaseName: grokbot2api ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # Chinese-first release notes; tauri-action still uploads bundle artifacts.
          releaseBody: |
            ## Windows 桌面客户端（Tauri 2，推荐）

            - **安装包**：NSIS（`.exe`）与 MSI
            - **内嵌工作台**：主窗口加载 `http://127.0.0.1:<port>/admin`，无需外置浏览器
            - **托盘**：启动 / 停止网关、打开工作台、退出
            - **侧栏**：总览 / 工作台（内嵌 `/admin`）/ 设置
            - **凭证导入**：可从本机 Grok Bot 导入机号与会话 JWT；**推理续期仍需粘贴** `sbi_…`（会话令牌不能用作 `SAND_INFERENCE_RENEWAL_CREDENTIAL`）

            需要本机 **Python 3.10+**（`python` 在 PATH）以启动捆绑的网关脚本。

            ### 旧版客户端

            仓库 `windows/` 下的 Tk/pystray 客户端已弃用，仍可从历史 Release 获取 PyInstaller 包。

      - name: Package portable zip
        shell: pwsh
        run: |
          $releaseDir = "desktop/src-tauri/target/release"
          $stage = "desktop/src-tauri/target/portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Join-Path $releaseDir "grokbot2api.exe"
          if (-not (Test-Path $exe)) {
            # package name may map to productName
            $exe = Get-ChildItem $releaseDir -Filter "*.exe" |
              Where-Object { $_.Name -notmatch '(?i)uninstall' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw "Release exe not found under $releaseDir" }
          Copy-Item $exe (Join-Path $stage "grokbot2api.exe")
          $gw = "desktop/src-tauri/resources/gateway"
          if (Test-Path $gw) {
            Copy-Item $gw (Join-Path $stage "gateway") -Recurse -Force
          }
          @"
          grokbot2api portable
          1. 确保已安装 Python 3.10+ 且 python 在 PATH
          2. 运行 grokbot2api.exe
          3. 在「凭证向导」导入 / 粘贴续期凭证后启动网关
          "@ | Set-Content -Encoding UTF8 (Join-Path $stage "README.txt")
          New-Item -ItemType Directory -Force -Path "desktop/dist" | Out-Null
          $zip = "desktop/dist/grokbot2api-windows-portable-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip
          Write-Host "Wrote $zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grokbot2api-windows-tauri-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/dist/grokbot2api-windows-portable-x64.zip
          if-no-files-found: warn

      - name: Attach portable zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/grokbot2api-windows-portable-x64.zip
          body: |
            ## Windows 桌面客户端（Tauri 2）

            - **NSIS / MSI**：见本 Release 由 tauri-action 上传的安装包
            - **Portable**（`grokbot2api-windows-portable-x64.zip`）：解压后运行 `grokbot2api.exe`，需系统 Python 3.10+
            - 主窗口**内嵌** `/admin` 工作台；托盘可启停网关
            - 可从 Grok Bot 导入机号与会话令牌；**推理仍需粘贴** `SAND_INFERENCE_RENEWAL_CREDENTIAL`（`sbi_…`）

            旧版 Tk 客户端已弃用（`windows/` 仍保留源码）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: keep building legacy PyInstaller artifacts for one more cycle (non-blocking).
  build-legacy-tk:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r windows/requirements-build.txt
      - name: Build portable (PyInstaller, deprecated)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File windows/build_portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: grokbot2api-windows-legacy-tk-x64
          path: windows/dist/grokbot2api-windows-portable-x64.zip
          if-no-files-found: warn
