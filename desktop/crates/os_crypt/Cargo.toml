[package]
name = "os_crypt"
version = "0.3.0"
edition = "2021"
description = "Chromium os_crypt v10 AES-GCM helpers (shared by grokbot2api desktop)"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
