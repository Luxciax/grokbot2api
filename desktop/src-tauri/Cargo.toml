[package]
name = "grokbot2api-desktop"
version = "0.3.8"
description = "grokbot2api Tauri desktop client — local gateway shell + embedded admin workbench"
authors = ["Luxciax"]
edition = "2021"

[lib]
name = "grokbot2api_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
parking_lot = "0.12"
which = "7"
url = "2"
os_crypt = { path = "../crates/os_crypt" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
